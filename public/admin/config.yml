backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # =========================
  # MENUS
  # =========================
  - name: "menus"
    label: "Cartes & Menus"
    files:
      - name: "menu_midi"
        label: "Carte Midi"
        file: "content/menu-midi.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }

          - label: "Formules"
            name: "formules"
            widget: "list"
            summary: "{{fields.label}} — {{fields.price}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Prix", name: "price", widget: "string" }

          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "sub", widget: "string", required: false }

              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Nom", name: "name", widget: "string" }
                  - { label: "Description", name: "desc", widget: "string", required: false }

              - { label: "Note de bas", name: "note", widget: "text", required: false }

      - name: "menu_soir_weekend"
        label: "Carte Soir & week-end"
        file: "content/menu-soir-weekend.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }

          - label: "Formules"
            name: "formules"
            widget: "list"
            summary: "{{fields.label}} — {{fields.price}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Prix", name: "price", widget: "string" }

          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "sub", widget: "string", required: false }

              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Nom", name: "name", widget: "string" }
                  - { label: "Description", name: "desc", widget: "string", required: false }

              - { label: "Note de bas", name: "note", widget: "text", required: false }

  # =========================
  # INFOS PRATIQUES
  # =========================
  - name: "infos"
    label: "Infos pratiques"
    files:
      - name: "infos"
        label: "Horaires, adresse, contact"
        file: "content/infos.json"
        format: "json"
        fields:
          - label: "Annonce (bandeau en haut du site)"
            name: "announcement"
            widget: "string"
            required: false
            hint: "Ex : Fermé exceptionnellement le 15 août. Laisser vide pour ne rien afficher."
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Téléphone", name: "phoneDisplay", widget: "string" }
          - { label: "Horaires du midi", name: "lunchHours", widget: "string", hint: "Ex : 12:00–14:00" }
          - { label: "Horaires du soir", name: "dinnerHours", widget: "string", hint: "Ex : 19:30–22:00" }
          - { label: "Jours de fermeture", name: "closedDays", widget: "string", required: false }
          - { label: "Moyens de paiement", name: "payments", widget: "string", required: false }
          - label: "À savoir"
            name: "goodToKnow"
            widget: "list"
            field: { label: "Ligne", name: "item", widget: "string" }

  # =========================
  # PHOTOS
  # =========================
  - name: "photos"
    label: "Photos"
    files:
      - name: "gallery"
        label: "Galerie"
        file: "content/photos.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt", name: "alt", widget: "string" }