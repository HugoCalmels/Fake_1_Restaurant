backend:
  name: git-gateway
  branch: main

local_backend: true
locale: "fr"

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # =========================
  # MENUS
  # =========================
  - name: "menus"
    label: "Cartes & Menus"
    files:
      - name: "menu_midi"
        label: "Carte Midi"
        file: "content/menu-midi.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }

          - label: "Formules"
            name: "formules"
            widget: "list"
            summary: "{{fields.label}} — {{fields.price}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Prix", name: "price", widget: "string" }

          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "sub", widget: "string", required: false }

              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Nom", name: "name", widget: "string" }
                  - { label: "Description", name: "desc", widget: "string", required: false }

              - { label: "Note de bas", name: "note", widget: "text", required: false }

      - name: "menu_soir_weekend"
        label: "Carte Soir & week-end"
        file: "content/menu-soir-weekend.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }

          - label: "Formules"
            name: "formules"
            widget: "list"
            summary: "{{fields.label}} — {{fields.price}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Prix", name: "price", widget: "string" }

          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "sub", widget: "string", required: false }

              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Nom", name: "name", widget: "string" }
                  - { label: "Description", name: "desc", widget: "string", required: false }

              - { label: "Note de bas", name: "note", widget: "text", required: false }

  # =========================
  # PAGE D'ACCUEIL (version française)
  # =========================
  - name: "home"
    label: "Page d’accueil"
    files:
      - name: "home"
        label: "Textes et photo de l’accueil"
        file: "content/home.json"
        format: "json"
        fields:
          - { label: "Petite ligne au-dessus du nom", name: "heroKicker", widget: "string" }
          - { label: "Phrase d’accroche", name: "heroSubtitle", widget: "string" }
          - { label: "Ligne sous les boutons", name: "heroNote", widget: "string", required: false }
          - { label: "Photo principale", name: "heroImage", widget: "image" }
          - { label: "Titre de la présentation", name: "aboutTitle", widget: "string" }
          - label: "Paragraphes de présentation"
            name: "aboutParagraphs"
            widget: "list"
            field: { label: "Paragraphe", name: "paragraph", widget: "text" }

  # =========================
  # INFOS PRATIQUES
  # =========================
  - name: "infos"
    label: "Infos pratiques"
    files:
      - name: "infos"
        label: "Horaires, adresse, contact"
        file: "content/infos.json"
        format: "json"
        fields:
          - label: "Annonce (bandeau en haut du site)"
            name: "announcement"
            widget: "string"
            required: false
            hint: "Ex : Fermé exceptionnellement le 15 août. Laisser vide pour ne rien afficher."
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Téléphone", name: "phoneDisplay", widget: "string" }
          - { label: "Horaires du midi", name: "lunchHours", widget: "string", hint: "Ex : 12:00–14:00" }
          - { label: "Horaires du soir", name: "dinnerHours", widget: "string", hint: "Ex : 19:30–22:00" }
          - label: "Jours d’ouverture"
            name: "schedule"
            widget: "object"
            hint: "Cochez les services ouverts. Le site affiche tout seul « Ouvert ce soir » ou « Fermé aujourd’hui »."
            fields:
              - label: "Lundi"
                name: "monday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
              - label: "Mardi"
                name: "tuesday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
              - label: "Mercredi"
                name: "wednesday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
              - label: "Jeudi"
                name: "thursday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
              - label: "Vendredi"
                name: "friday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
              - label: "Samedi"
                name: "saturday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
              - label: "Dimanche"
                name: "sunday"
                widget: "object"
                fields: [{ label: "Midi", name: "lunch", widget: "boolean", default: true }, { label: "Soir", name: "dinner", widget: "boolean", default: true }]
          - { label: "Moyens de paiement", name: "payments", widget: "string", required: false }
          - label: "À savoir"
            name: "goodToKnow"
            widget: "list"
            field: { label: "Ligne", name: "item", widget: "string" }

  # =========================
  # PHOTOS
  # =========================
  - name: "photos"
    label: "Photos"
    files:
      - name: "gallery"
        label: "Galerie"
        file: "content/photos.json"
        format: "json"
        fields:
          - { label: "Texte d’introduction", name: "intro", widget: "text", required: false }
          - label: "Albums"
            name: "albums"
            widget: "list"
            summary: "{{fields.title}}"
            collapsed: true
            hint: "Ex : Nos plats, Desserts, La salle. Chaque album devient un filtre sur la page. Faites glisser pour changer l’ordre."
            fields:
              - { label: "Nom de l’album", name: "title", widget: "string" }
              - { label: "Petit texte sous le nom", name: "description", widget: "text", required: false }
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.alt}}"
                collapsed: true
                hint: "La toute première photo du premier album s’affiche en grand en haut de la page."
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Titre", name: "alt", widget: "string", hint: "Court, ex : Côte de bœuf pour deux" }
                  - { label: "Description", name: "caption", widget: "text", required: false, hint: "Une ou deux phrases : ce qui rend ce plat ou ce lieu spécial." }
                  - { label: "Coup de cœur du chef", name: "signature", widget: "boolean", required: false, default: false, hint: "Affiche la photo en plus grand avec un badge. À réserver à 2 ou 3 plats par album." }
